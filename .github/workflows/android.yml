name: Build OFFLINE 0.4.2 ARM64 (permanent signing)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build optimized ARM64 release
        run: gradle :app:assembleRelease --no-daemon --console=plain

      - name: Restore permanent signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.OFFLINE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo 'Missing OFFLINE_KEYSTORE_BASE64 GitHub Actions secret' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/offline-release.jks"
          test -s "$RUNNER_TEMP/offline-release.jks"

      - name: Align and sign APK with permanent key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.OFFLINE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OFFLINE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OFFLINE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?Missing OFFLINE_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing OFFLINE_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing OFFLINE_KEY_PASSWORD}"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/offline-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/offline-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/release/OFFLINE-v0.4.2-arm64-signed.apk \
            "$RUNNER_TEMP/offline-aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/OFFLINE-v0.4.2-arm64-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OFFLINE-v0.4.2-ARM64-permanently-signed
          path: app/build/outputs/apk/release/OFFLINE-v0.4.2-arm64-signed.apk
          if-no-files-found: error
